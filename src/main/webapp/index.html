<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIS | Login</title>
    <link rel="stylesheet" href="css/sis-ui.css">
</head>
<body>
<div class="login-page">
    <div class="login-card simple-login-card">
        <form action="login" method="POST">
            <div class="login-brand minimal-login-brand">
                <h1>Login</h1>
                <p>Enter your account information.</p>
            </div>

            <div id="login-feedback" class="form-message hidden"></div>

            <div class="field">
                <label for="email">Email</label>
                <input id="email" name="email" type="email" placeholder="user@example.com" required>
            </div>

            <div class="field">
                <label for="password">Password</label>
                <input id="password" name="password" type="password" placeholder="••••••••" required>
            </div>

            <button class="login-btn" type="submit">Log in</button>
        </form>
    </div>
</div>
<script>
    (function () {
        const params = new URLSearchParams(window.location.search);
        const error = params.get('error');
        const feedback = document.getElementById('login-feedback');
        if (!feedback || !error) return;
        const messages = {
            invalid: 'Invalid email or password.',
            inactive: 'This account is inactive.',
            missing: 'Email and password are required.'
        };
        feedback.textContent = messages[error] || 'Login failed.';
        feedback.classList.remove('hidden');
        feedback.classList.add('error');
    })();
</script>
</body>
</html>
